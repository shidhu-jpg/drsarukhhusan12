<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildWithShidhu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #0f172a;
    color: white;
}

/* HERO */
.hero {
    text-align: center;
    padding: 100px 20px;
}

.hero h1 {
    font-size: 38px;
}

.hero span {
    color: #38bdf8;
}

.hero p {
    margin-top: 10px;
    opacity: 0.7;
}

.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 26px;
    background: linear-gradient(45deg, #38bdf8, #6366f1);
    border-radius: 8px;
    color: white;
    text-decoration: none;
    font-weight: 600;
}

/* PROJECTS */
.section {
    padding: 60px 10%;
}

.projects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.card {
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    overflow: hidden;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
}

.card img {
    width: 100%;
}

.card-content {
    padding: 15px;
}

.card h3 {
    margin-bottom: 8px;
}

.card a {
    display: inline-block;
    margin-top: 10px;
    color: #38bdf8;
    text-decoration: none;
    font-weight: 500;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 30px;
    opacity: 0.6;
}
</style>

</head>
<body>

<!-- HERO -->
<section class="hero">
    <h1>Websites That Bring <span>More Patients</span></h1>
    <p>Built for clinics. Fast, modern, conversion-focused.</p>
    <a href="https://wa.me/919341784664" class="btn">Get Your Website</a>
</section>

<!-- PROJECTS -->
<section class="section">
    <div class="projects">

        <!-- PROJECT 1 -->
        <div class="card">
            <img src="project1.jpg">
            <div class="card-content">
                <h3>Dental Clinic</h3>
                <a href="https://yourprojectlink1.com" target="_blank">View Website →</a>
            </div>
        </div>

        <!-- PROJECT 2 -->
        <div class="card">
            <img src="project2.jpg">
            <div class="card-content">
                <h3>Skin Clinic</h3>
                <a href="https://yourprojectlink2.com" target="_blank">View Website →</a>
            </div>
        </div>

        <!-- PROJECT 3 -->
        <div class="card">
            <img src="project3.jpg">
            <div class="card-content">
                <h3>Physiotherapy</h3>
                <a href="https://yourprojectlink3.com" target="_blank">View Website →</a>
            </div>
        </div>

        <!-- PROJECT 4 -->
        <div class="card">
            <img src="project4.jpg">
            <div class="card-content">
                <h3>General Clinic</h3>
                <a href="https://yourprojectlink4.com" target="_blank">View Website →</a>
            </div>
        </div>

    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 BuildWithShidhu</p>
</footer>

</body>
</html>
